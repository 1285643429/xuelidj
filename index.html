<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="RATING" content="RTA-5042-1996-1400-1577-RTA">
<title>雪梨短剧</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:#0b0b10;color:#f0d9e6;font-family:-apple-system,"PingFang SC",sans-serif;overflow:hidden;}

  .page{display:none;position:absolute;top:0;left:0;right:0;bottom:58px;overflow-y:auto;background:#0b0b10;}
  .page.show{display:block;}

  #page-home{overflow:hidden;}
  .feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;}
  .feed::-webkit-scrollbar{display:none;}
  .feeditem{position:relative;height:100%;scroll-snap-align:start;background:#000;}
  .feeditem iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .feeditem .overlay{position:absolute;left:0;right:0;bottom:0;padding:16px 14px 20px;background:linear-gradient(transparent,rgba(0,0,0,.78));z-index:5;pointer-events:none;}
  .feeditem .title{font-size:18px;font-weight:bold;color:#fff;pointer-events:auto;}
  .feeditem .desc{font-size:13px;color:#ffd0e4;margin-top:6px;pointer-events:auto;}
  .feeditem .tags{margin-top:8px;display:flex;gap:8px;pointer-events:auto;}
  .feeditem .tag{font-size:11px;color:#ff9ec7;background:rgba(255,77,148,.18);padding:3px 9px;border-radius:8px;}
  .feeditem .open{pointer-events:auto;margin-top:12px;display:inline-flex;align-items:center;background:rgba(255,77,148,.92);color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;font-weight:bold;cursor:pointer;}
  .feeditem .side{position:absolute;right:10px;bottom:130px;z-index:6;display:flex;flex-direction:column;gap:18px;align-items:center;pointer-events:none;}
  .feeditem .side .si{pointer-events:auto;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:11px;gap:3px;cursor:pointer;}
  .feeditem .side .si .ic{font-size:26px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));}
  .feedtop{position:absolute;top:0;left:0;right:0;z-index:7;display:flex;justify-content:center;gap:24px;padding:14px;background:linear-gradient(rgba(0,0,0,.5),transparent);pointer-events:none;}
  .feedtop .ft{font-size:15px;color:#b99fae;position:relative;cursor:pointer;pointer-events:auto;}
  .feedtop .ft.on{color:#fff;font-weight:bold;}
  .feedtop .ft.on::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;width:16px;height:3px;border-radius:2px;background:#ff4d94;}
  .feedtop .fsearch{position:absolute;right:16px;top:14px;color:#fff;font-size:20px;cursor:pointer;pointer-events:auto;}

  .bar{position:sticky;top:0;z-index:20;background:#0b0b10;padding:12px 14px;}
  .searchbox{display:flex;align-items:center;background:#1b1b24;border:1px solid #2c2c38;border-radius:22px;padding:9px 14px;}
  .searchbox input{flex:1;background:none;border:0;outline:0;color:#ffe3f0;font-size:13px;}
  .searchbox input::placeholder{color:#7a6a78;}
  .searchbox .sicon{color:#ff5fa2;margin-right:8px;font-size:14px;}
  .cats{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;background:#0b0b10;}
  .cats::-webkit-scrollbar{display:none;}
  .cat{flex:0 0 auto;padding:7px 16px;border-radius:18px;background:#1b1b24;color:#b99fae;font-size:13px;border:1px solid #2c2c38;cursor:pointer;}
  .cat.on{background:linear-gradient(135deg,#ff4d94,#ff7ab8);color:#fff;border-color:transparent;font-weight:bold;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 14px 14px;}
  .card{background:#16161d;border-radius:14px;overflow:hidden;border:1px solid #23232e;cursor:pointer;}
   .card .cv{position:relative;aspect-ratio:3/4;background:#23232e;}
  .card .cv img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .cv .heat{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#ff9ec7;font-size:10px;padding:3px 7px;border-radius:8px;}
  .card .cv .lock{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#ffd0e4;font-size:10px;padding:3px 7px;border-radius:8px;}
  .card .cv .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ff5fa2;font-size:36px;text-shadow:0 2px 14px rgba(0,0,0,.7);opacity:.9;}
  .card .t{font-size:13px;font-weight:bold;color:#ffe3f0;padding:9px 10px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card .s{font-size:11px;color:#8a7a83;padding:0 10px 10px;}

  .layer{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column;}
  .layer.show{display:flex;}
  .player-head{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.7);}
  .player-head .tt{color:#ffe3f0;font-size:15px;font-weight:bold;}
  .player-head button{background:#ff4d94;color:#fff;border:0;border-radius:18px;padding:7px 16px;font-size:13px;cursor:pointer;}
  .tgbox{flex:1;position:relative;background:#000;}
  .tgbox iframe{border:0;position:absolute;top:0;left:0;width:100%;height:100%;}
  .epbar{background:#101018;border-top:1px solid #23232e;padding:10px 14px;}
  .epbar .lab{font-size:12px;color:#b99fae;margin-bottom:8px;}
  .eps{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
  .eps::-webkit-scrollbar{display:none;}
  .ep{flex:0 0 auto;min-width:44px;height:44px;border-radius:10px;background:#1b1b24;border:1px solid #2c2c38;color:#ffe3f0;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .ep.on{background:linear-gradient(135deg,#ff4d94,#ff7ab8);border-color:transparent;font-weight:bold;}

  .mehead{padding:24px 16px 16px;display:flex;align-items:center;gap:14px;}
  .meava{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#ff4d94,#ff7ab8);display:flex;align-items:center;justify-content:center;font-size:26px;}
  .meinfo .mname{font-size:19px;font-weight:bold;color:#ffe3f0;}
  .meinfo .mid{font-size:11px;color:#8a7a83;margin-top:3px;}
  .mecards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px;}
  .mecard{border-radius:14px;padding:14px;position:relative;overflow:hidden;}
  .mecard.coin{background:linear-gradient(135deg,#2a1a0d,#4a3418);border:1px solid #5a4426;}
  .mecard.vip{background:linear-gradient(135deg,#3a0d2a,#6b1b47);border:1px solid #6b1b47;}
  .mecard .lab{font-size:12px;color:#ffd699;}
  .mecard.vip .lab{color:#ffb3d1;}
  .mecard .num{font-size:22px;font-weight:bold;color:#ffe9b0;margin:4px 0 10px;}
  .mecard.vip .num{font-size:14px;color:#ffe3f0;}
  .mecard .btn{display:inline-block;background:linear-gradient(135deg,#ffb347,#ffcf7a);color:#4a2c00;font-size:12px;padding:6px 14px;border-radius:14px;font-weight:bold;cursor:pointer;}
  .mecard.vip .btn{background:linear-gradient(135deg,#ff4d94,#ff7ab8);color:#fff;}
  .mecard .deco{position:absolute;right:8px;bottom:6px;font-size:34px;opacity:.5;}
  .melist{margin:14px;background:#16161d;border:1px solid #23232e;border-radius:14px;overflow:hidden;}
  .merow{display:flex;align-items:center;padding:14px;border-bottom:1px solid #1f1f28;cursor:pointer;}
  .merow:last-child{border-bottom:0;}
  .merow .mic{width:34px;height:34px;border-radius:9px;background:#23232e;display:flex;align-items:center;justify-content:center;font-size:16px;margin-right:12px;}
  .merow .mt{flex:1;font-size:14px;color:#ffe3f0;}
   .merow .mv{font-size:11px;color:#ff9ec7;background:rgba(255,77,148,.15);padding:2px 8px;border-radius:8px;margin-right:8px;}
  .merow .arw{color:#5a4a55;font-size:14px;}
  .mehistory{margin:14px;}
  .mehtabs{display:flex;gap:20px;border-bottom:1px solid #1b1b24;padding-bottom:8px;}
  .mehtab{font-size:14px;color:#8a7a83;position:relative;cursor:pointer;}
  .mehtab.on{color:#ffe3f0;font-weight:bold;}
  .mehtab.on::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:-9px;width:18px;height:3px;border-radius:2px;background:linear-gradient(135deg,#ff4d94,#ff7ab8);}
  .meempty{padding:40px 0;text-align:center;color:#5a4a55;font-size:13px;}
  .meempty .eic{font-size:40px;display:block;margin-bottom:10px;opacity:.5;}

  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#101018;border-top:1px solid #23232e;display:flex;height:58px;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8a7a83;font-size:11px;gap:3px;cursor:pointer;}
  .tab .ic{font-size:20px;}
  .tab.on{color:#2ee6a8;}

  .empty{padding:40px;text-align:center;color:#7a6a78;font-size:13px;}

  .adrow{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 12px;scrollbar-width:none;}
  .adrow::-webkit-scrollbar{display:none;}
  .adcard{flex:0 0 auto;width:110px;cursor:pointer;}
  .adcard .aic{position:relative;width:110px;height:70px;border-radius:10px;overflow:hidden;background:#1b1b24;display:flex;align-items:center;justify-content:center;font-size:12px;color:#ffd0e4;text-align:center;padding:6px;}
  .adcard .aic.a1{background:linear-gradient(135deg,#3a0d2a,#6b1b47);}
  .adcard .aic.a2{background:linear-gradient(135deg,#1b0d3a,#3f1b6b);}
  .adcard .aic.a3{background:linear-gradient(135deg,#3a2a0d,#6b4a1b);}
  .adcard .aic .adt{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.5);color:#ffd0e4;font-size:9px;padding:1px 5px;border-radius:5px;}
  .adcard .anm{font-size:11px;color:#b99fae;margin-top:5px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .notice{margin:4px 14px 12px;background:linear-gradient(135deg,#2a1a0d,#4a3418);border:1px solid #5a4426;border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:8px;}
  .notice .nic{font-size:14px;}
  .notice .nt{flex:1;font-size:11px;color:#ffd699;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .notice .nb{background:linear-gradient(135deg,#ff4d94,#ff7ab8);color:#fff;font-size:11px;padding:5px 12px;border-radius:12px;font-weight:bold;cursor:pointer;}
  .notice .nx{color:#8a7a83;font-size:14px;cursor:pointer;}
</style>
</head>
<body>

  <div class="page show" id="page-home">
    <div class="feedtop">
      <div class="ft">随机</div>

      <div class="merow" data-act="agent"><div class="mic">💰</div><div class="mt">代理中心</div><div class="arw">›</div></div>
      <div class="merow" data-act="update"><div class="mic">🔄</div><div class="mt">更新中心</div><div class="arw">›</div></div>

      <div class="merow" data-act="email"><div class="mic">✉️</div><div class="mt">绑定邮箱</div><div class="mv">100金币</div><div class="arw">›</div></div>
      <div class="merow" data-act="apk"><div class="mic">📱</div><div class="mt">下载 App</div><div class="arw">›</div></div>
    </div>
    <div class="mehistory">
      <div class="mehtabs">
        <div class="mehtab on">历史</div>
        <div class="mehtab">收藏</div>

  <div class="layer" id="player">

      <div class="eps" id="eps"></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab on" data-tab="home"><div class="ic">🎬</div>首页</div>
    <div class="tab" data-tab="juchang"><div class="ic">📺</div>剧场</div>
    <div class="tab" data-tab="pianku"><div class="ic">🎞️</div>片库</div>
    <div class="tab" data-tab="me"><div class="ic">👤</div>我的</div>
  </div>

<script>
var APK_URL = 'https://raw.githubusercontent.com/1285643429/xuelidj/main/xueli.apk';

var JC_CATS = ['全部','推荐','都市','人妻','师生','职场','古装','VIP专区'];
var PK_CATS = ['全部','最新','最热','短剧','系列','完结','连载中'];

var ADS = [
  { name:'广告位 1', cls:'a1', txt:'🔥 广告位', url:'#' },
  { name:'广告位 2', cls:'a2', txt:'💎 广告位', url:'#' },
  { name:'广告位 3', cls:'a3', txt:'🎁 广告位', url:'#' },
  { name:'广告位 4', cls:'a1', txt:'📣 广告位', url:'#' }
];

var SHOWS = [
  { id:'s1', title:'正经设计师', tag:'都市', thumb:'', hot:true, vip:false, heat:'3.2万',
    desc:'职场精英的隐秘设计图…',
    episodes:[
      { title:'第1集', url:'https://player.mediadelivery.net/embed/816201/c16918c5-c2e8-4776-b1c1-5668b531389f?autoplay=true&loop=false&muted=true&preload=true&responsive=true' },
       for(var i=0;i<n;i++)h+='<div class="ep'+(i===curEp?' on':'')+'" data-i="'+i+'">'+(i+1)+'</div>';
  document.getElementById('eps').innerHTML=h;
  document.getElementById('eplab').textContent='选集 更新至 '+n+' 集';
}
function playEp(i){
  curEp=i;var ep=curShow.episodes[i];
  document.getElementById('ptitle').textContent=curShow.title+' '+ep.title;
  document.getElementById('pbox').innerHTML='<iframe src="'+ep.url+'" loading="lazy" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen;" allowfullscreen="true"></iframe>';
  renderEps();
}

function bindCard(el){
  el.addEventListener('click',function(e){
    var c=e.target.closest('.card');if(!c)return;
    var s=SHOWS.find(function(x){return x.id===c.dataset.id;});
    if(s)openShow(s);
  });
}
bindCard(document.getElementById('jc-grid'));
bindCard(document.getElementById('pk-grid'));

document.getElementById('jc-cats').addEventListener('click',function(e){
  var c=e.target.closest('.cat');if(!c)return;
  curJcCat=c.dataset.c;
  renderCats(JC_CATS,document.getElementById('jc-cats'),curJcCat);
  renderJC();
});
document.getElementById('pk-cats').addEventListener('click',function(e){
  var c=e.target.closest('.cat');if(!c)return;
  curPkCat=c.dataset.c;
  renderCats(PK_CATS,document.getElementById('pk-cats'),curPkCat);
  renderPK();
});
document.querySelector('#page-juchang .q').addEventListener('input',renderJC);
document.querySelector('#page-pianku .q').addEventListener('input',renderPK);

document.getElementById('feed').addEventListener('click',function(e){
  var o=e.target.closest('.open');if(!o)return;
  var s=SHOWS.find(function(x){return x.id===o.dataset.sid;});
  if(s)openShow(s);
});

document.getElementById('eps').addEventListener('click',function(e){
  var el=e.target.closest('.ep');if(!el)return;
  playEp(parseInt(el.dataset.i,10));
});
document.getElementById('back').addEventListener('click',function(){
  document.getElementById('player').classList.remove('show');
  document.getElementById('pbox').innerHTML='';
  var feed=document.getElementById('feed');
  if(FEED_HTML){ feed.innerHTML=FEED_HTML; }
});

document.querySelectorAll('.tab').forEach(function(el){
  el.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    el.classList.add('on');
    var t=el.dataset.tab;
    var map={'home':'page-home','juchang':'page-juchang','pianku':'page-pianku','me':'page-me'};
    for(var k in map){
      document.getElementById(map[k]).classList.toggle('show', k===t);
    }
  });
});

document.querySelectorAll('.merow').forEach(function(el){
  el.addEventListener('click',function(){
    var act=el.dataset.act;
    if(act==='apk'){ window.open(APK_URL,'_blank'); return; }
    var names={sign:'签到福利',agent:'代理中心',update:'更新中心',urge:'催更中心',brand:'品牌官网',social:'官方社媒',email:'绑定邮箱'};
    alert((names[act]||'该功能')+'即将上线，敬请期待～');
  });
});
document.querySelectorAll('.mehtab').forEach(function(el){
  el.addEventListener('click',function(){
    document.querySelectorAll('.mehtab').forEach(function(x){x.classList.remove('on');});
    el.classList.add('on');
  });
});
document.getElementById('rechargeBtn').addEventListener('click',function(){alert('金币充值功能即将上线～');});
document.getElementById('openVipBtn').addEventListener('click',function(){alert('会员开通功能即将上线～');});
document.getElementById('feedSearch').addEventListener('click',function(){
  document.querySelector('.tab[data-tab="juchang"]').click();
});

function renderAds(){
  var h='';
  ADS.forEach(function(a,i){
    h+='<div class="adcard" data-url="'+esc(a.url)+'">'+
       '<div class="aic '+a.cls+'"><span class="adt">广告</span>'+esc(a.txt)+'</div>'+
       '<div class="anm">'+esc(a.name)+'</div></div>';
  });
   document.getElementById('jc-adrow').innerHTML=h;
  document.getElementById('pk-adrow').innerHTML=h;
}
document.querySelectorAll('.adrow').forEach(function(el){
  el.addEventListener('click',function(e){
    var c=e.target.closest('.adcard');if(!c)return;
    var url=c.dataset.url;
    if(url && url!=='#'){ window.open(url,'_blank'); }
    else{ alert('广告位预留，等待接入广告商～'); }
  });
});
document.querySelectorAll('.notice .nb').forEach(function(el){
  el.addEventListener('click',function(){alert('会员开通功能即将上线～');});
});
document.querySelectorAll('.notice .nx').forEach(function(el){
  el.addEventListener('click',function(){
    document.getElementById(el.dataset.close).style.display='none';
  });
});

buildFeed();
renderCats(JC_CATS,document.getElementById('jc-cats'),curJcCat);
renderCats(PK_CATS,document.getElementById('pk-cats'),curPkCat);
renderAds();
renderJC();renderPK();
